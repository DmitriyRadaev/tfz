
upstream tfz_app_upstream {
    server tfz_app:3005;
}

map $http_upgrade $tfz_connection_upgrade {
    default upgrade;
    '' close;
}

# Сохраняем публичный Host и протокол при проходе через основной Nginx.
map $http_x_forwarded_host $tfz_forwarded_host {
    default $http_x_forwarded_host;
    '' $http_host;
}

map $http_x_forwarded_proto $tfz_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name 172.26.4.9;

    client_max_body_size 50M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Относительный Location сохраняет порт :8084 при отладке.
    absolute_redirect off;
    location = /calculate-tfz {
        return 308 /calculate-tfz/$is_args$args;
    }

    # Без '/' после upstream — Next.js получает путь вместе с basePath.
    location ^~ /calculate-tfz/ {
        proxy_pass http://tfz_app_upstream;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tfz_connection_upgrade;

        proxy_set_header Host $tfz_forwarded_host;
        proxy_set_header X-Forwarded-Host $tfz_forwarded_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tfz_forwarded_proto;

        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
