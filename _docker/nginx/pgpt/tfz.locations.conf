# Добавить внутрь существующего server {} основного Nginx (порт 80).
# Основной контейнер должен иметь extra_hosts: ["host.docker.internal:host-gateway"].
# Используем уже опубликованный порт TFZ; общая Docker-сеть не требуется.
# В proxy_pass нет завершающего '/', чтобы сохранить /calculate-tfz/.

location = /calculate-tfz {
    absolute_redirect off;
    return 308 /calculate-tfz/$is_args$args;
}

location ^~ /calculate-tfz/ {
    client_max_body_size 50M;
    proxy_pass http://host.docker.internal:8084;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
}
